<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2e5"><title>Defterim</title>
<style>
:root{
  --paper:#f7f2e5; --card:#fffdf6; --ink:#1d2b3a; --mute:#6c7480; --rule:#ddd2b8;
  --pos:#2e7d50; --neg:#b4432d; --accent:#b9822a; --accent-soft:#f1e3c4; --margin:#d9786a;
  --shadow:0 1px 0 rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14181e; --card:#1c222b; --ink:#ece5d3; --mute:#98a0ab; --rule:#33394a;
    --pos:#58b97f; --neg:#e07a64; --accent:#d9a548; --accent-soft:#2c2a22; --margin:#a8574c; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#14181e; --card:#1c222b; --ink:#ece5d3; --mute:#98a0ab; --rule:#33394a;
  --pos:#58b97f; --neg:#e07a64; --accent:#d9a548; --accent-soft:#2c2a22; --margin:#a8574c; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;margin:0}
header{padding:20px 16px 0;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font-size:30px;letter-spacing:.3px}
.brand h1 span{color:var(--accent)}
.brand .tools{display:flex;gap:8px;align-items:center}
.brand .tools label{font-size:13px;color:var(--mute)}
input[type=month]{font:inherit}
nav{display:flex;gap:2px;margin-top:14px;border-bottom:3px double var(--ink);overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;padding:9px 14px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--card);color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
main{max-width:1400px;margin:0 auto;padding:18px 16px 110px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--rule);border-left:3px double var(--margin);border-radius:6px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi small{display:block;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.kpi b{display:block;font-family:Georgia,serif;font-size:23px;margin-top:2px;white-space:nowrap}
.kpi i{font-style:normal;font-size:12px;color:var(--mute)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
/* hücreler satır kırar: tablo yana kaydırma gerektirmeden sayfaya sığar (tutarlar boşluksuz olduğu için bölünmez) */
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--mute);text-align:right;padding:6px 6px;border-bottom:2px solid var(--ink);vertical-align:bottom}
td{padding:7px 6px;border-bottom:1px solid var(--rule);text-align:right;vertical-align:top;overflow-wrap:break-word}
td .mini{margin:1px 0}
@media (max-width:700px){table{font-size:13px}td,th{padding:6px 4px}}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.muted{color:var(--mute)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:middle}
.alert{border-left:4px solid var(--neg);background:color-mix(in srgb,var(--neg) 10%,var(--card));padding:10px 12px;border-radius:4px;margin-bottom:10px}
.ok{border-left:4px solid var(--pos);background:color-mix(in srgb,var(--pos) 10%,var(--card));padding:10px 12px;border-radius:4px;margin-bottom:10px}
.chart{width:100%;height:auto;display:block}
.chart text{font:11px "Segoe UI",sans-serif;fill:var(--mute)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
button,.btn{font:inherit;cursor:pointer}
.primary{background:var(--ink);color:var(--paper);border:0;padding:8px 16px;border-radius:6px;font-weight:600}
.ghost{background:none;border:1px solid var(--rule);color:var(--ink);padding:7px 12px;border-radius:6px}
.mini{background:none;border:1px solid var(--rule);color:var(--ink);padding:2px 9px;border-radius:5px;font-size:12px}
.mini.del{color:var(--neg)}
#fab{position:fixed;right:18px;bottom:18px;background:var(--accent);color:#fff;border:0;border-radius:99px;padding:13px 22px;font-weight:700;z-index:5}
dialog{border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);padding:20px;width:min(440px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(20,15,5,.45)}
dialog h3{margin-bottom:12px;font-size:20px}
.f{display:block;margin-bottom:10px;font-size:13px;color:var(--mute)}
.f input,.f select{display:block;width:100%;margin-top:3px;padding:8px 10px;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.bar>div{height:100%;background:var(--accent)}
.catrow{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.catrow span:last-child{text-align:right}
.empty{padding:22px;text-align:center;color:var(--mute)}
.sect{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}
.sect h2{font-size:20px}
.settings label{display:block;max-width:360px}
@media (max-width:560px){.kpi b{font-size:19px}.brand h1{font-size:25px}}
@media (max-width:700px){input,select,textarea{font-size:16px!important}}  /* iPhone: odaklanınca yakınlaşmayı engeller */
input,select,button{touch-action:manipulation}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Defter<span>im</span></h1>
    <div class="tools">
      <label for="selm">Ay</label>
      <input type="month" id="selm" aria-label="Ay seç">
      <button class="ghost" id="cloud" title="Google Drive eşitleme" aria-label="Google Drive eşitleme">☁ Drive</button>
      <button class="ghost" id="theme" title="Tema" aria-label="Tema değiştir">◐</button>
    </div>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="view"></main>
<button id="fab">+ İşlem ekle</button>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("tr-TR", {style:"currency", currency:"TRY", maximumFractionDigits:2});
const fmt = n => nf.format(Math.round((n || 0) * 100) / 100);
const cls = n => n < -0.005 ? "neg" : n > 0.005 ? "pos" : "";
const short = v => { const a = Math.abs(v); return a >= 1e6 ? (v/1e6).toFixed(1).replace(".0","") + "M" : a >= 1e4 ? Math.round(v/1e3) + "K" : a >= 1e3 ? (v/1e3).toFixed(1).replace(".0","") + "K" : String(Math.round(v)); };
const MONTHS = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const lbl = ym => MONTHS[+ym.slice(5) - 1] + " " + ym.slice(2, 4);
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
const thisYM = () => todayISO().slice(0, 7);
function addM(ym, n){ let [y, m] = ym.split("-").map(Number); m += n - 1; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + "-" + pad(m + 1); }
const dim = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const dateIn = (ym, day) => ym + "-" + pad(Math.min(Math.max(+day || 1, 1), dim(ym)));
const endOf = ym => ym + "-" + pad(dim(ym));
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
const trDate = iso => iso.slice(8) + "." + iso.slice(5, 7) + "." + iso.slice(0, 4);

/* ---------- tutar alanlarında hesap makinesi: + − * / ve parantez (eval kullanılmaz) ----------
   "1750*2" → 3500. Ondalık için virgül ya da nokta; "1.750" binlik ayracı sayılır, "1.5" ondalıktır. */
function calcNum(t){
  if (t.includes(".") && t.includes(","))   /* ikisi birden varsa, sonda gelen ayraç ondalıktır: 1.750,50 ve 1,750.50 */
    t = t.lastIndexOf(",") > t.lastIndexOf(".") ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  else if (t.includes(",")){ if ((t.match(/,/g) || []).length > 1) return NaN; t = t.replace(",", "."); }
  else if (/^[1-9]\d{0,2}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  return /^\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN;
}
function calcEval(src){
  const s = String(src ?? "").trim().replace(/₺|TL/gi, "").replace(/[×xX]/g, "*").replace(/[÷:]/g, "/").replace(/\s+/g, "");
  if (!s) return NaN;
  const tok = s.match(/\d[\d.,]*|[-+*/()]|./g).map(t => /^\d/.test(t) ? calcNum(t) : t);
  let i = 0;
  const factor = () => { const t = tok[i++];
    if (t === undefined) return NaN; if (t === "-") return -factor(); if (t === "+") return factor();
    if (t === "("){ const v = expr(); return tok[i++] === ")" ? v : NaN; }
    return typeof t === "number" ? t : NaN; };
  const term = () => { let v = factor(); while (tok[i] === "*" || tok[i] === "/"){ const o = tok[i++], r = factor(); v = o === "*" ? v * r : v / r; } return v; };
  const expr = () => { let v = term(); while (tok[i] === "+" || tok[i] === "-"){ const o = tok[i++], r = term(); v = o === "+" ? v + r : v - r; } return v; };
  const v = expr();
  return i === tok.length && isFinite(v) ? Math.round(v * 100) / 100 : NaN;
}
const fmtPlain = v => String(Math.round((+v || 0) * 100) / 100).replace(".", ",");
const isExpr = s => /[-+*/()xX×÷:]/.test(String(s).trim().replace(/^[-+]/, ""));
document.addEventListener("input", e => { const el = e.target;
  if (!(el.matches && el.matches("input[data-calc]"))) return;
  let h = el.nextElementSibling; if (!h || !h.classList.contains("calc-hint")){ h = document.createElement("small"); h.className = "calc-hint muted"; el.after(h); }
  const v = calcEval(el.value); h.textContent = !isExpr(el.value) ? "" : isNaN(v) ? "İşlem anlaşılamadı" : "= " + fmt(v); });
const calcCommit = el => { if (!el.matches || !el.matches("input[data-calc]")) return;
  const v = calcEval(el.value); if (!isNaN(v) && el.value.trim()){ el.value = fmtPlain(v); const h = el.nextElementSibling; if (h && h.classList.contains("calc-hint")) h.textContent = ""; } };
document.addEventListener("focusout", e => calcCommit(e.target));
document.addEventListener("keydown", e => { if (e.key === "Enter") calcCommit(e.target); });

/* ---------- veri ---------- */
const KEY = "defterim_v1";
const blank = () => ({accounts:[], tx:[], loans:[], taksit:[], rec:[], occ:{}, settings:{base: thisYM() + "-01", goalMonthly:0, goalTotal:0}});
let db = blank();
function load(){ try { const r = localStorage.getItem(KEY); if (r) db = Object.assign(blank(), JSON.parse(r)); } catch(e){ console.warn("Okunamadı", e); } }
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const SNAP = KEY + "_snap_";
const snapKeys = () => { try { return Object.keys(localStorage).filter(k => k.startsWith(SNAP)).sort(); } catch(e){ return []; } };
function save(){ db.meta = {updated: Math.max(Date.now(), ((db.meta && db.meta.updated) || 0) + 1)}; persist(); Drive.queue(); }
function persist(){
  try {
    db.tx.forEach(t => { if (t.type !== "transfer") delete t.to; });   /* gider/gelirde kalan eski gizli "hedef" alanını temizle */
    const s = JSON.stringify(db), prev = localStorage.getItem(KEY);
    if (prev && prev !== s) localStorage.setItem(KEY + "_bak", prev);   /* tek adım geri alma */
    localStorage.setItem(KEY, s);
    localStorage.setItem(SNAP + todayISO(), s);                           /* günün son durumu */
    snapKeys().slice(0, -7).forEach(k => localStorage.removeItem(k));    /* son 7 gün kalsın */
  } catch(e){ alert("Tarayıcı veriyi kaydedemedi: " + e.message + "\nLütfen Ayarlar'dan yedeği indirin."); }
}
function restoreFrom(key){
  const raw = lsGet(key); if (!raw) return alert("Yedek bulunamadı.");
  if (!confirm("Mevcut veri bu yedekle değiştirilecek (şimdiki hâli tek adım geri alma olarak saklanır). Devam?")) return;
  db = Object.assign(blank(), JSON.parse(raw)); save(); render();
}
const S = {tab:"ozet", m: thisYM(), acc:""};

/* ---------- Google Drive eşitleme ----------
   Veri, kullanıcının Drive'ındaki uygulamaya özel gizli klasörde (appDataFolder) tek bir json dosyası olarak tutulur.
   Yalnızca bu uygulamanın kendi dosyasına erişir; Drive'ın geri kalanını göremez. */
const Drive = (() => {
  const CID = "defterim_gclient", LAST = "defterim_lastsync", CONN = "defterim_gconn", FILE = "defterim.json";
  const SCOPE = "https://www.googleapis.com/auth/drive.appdata", API = "https://www.googleapis.com";
  let token = null, exp = 0, timer = null, busy = false, lastRun = 0, gsiP = null;
  const st = {state:"off", msg:"Bağlı değil", at:0};
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch(e){} };
  /* halka açık OAuth istemci kimliği (sır değildir); Ayarlar'dan değiştirilirse o kullanılır */
  const DEFAULT_CID = "579299258289-q3mb2445rvslnn51k0b4vrd351vsqn6s.apps.googleusercontent.com";
  const clientId = () => (lsGet(CID) || DEFAULT_CID).trim();
  const isEmpty = d => !d.accounts.length && !d.tx.length && !d.loans.length && !d.rec.length && !d.taksit.length;
  const tstr = ms => ms ? new Date(ms).toLocaleString("tr-TR") : "bilinmiyor";
  function set(state, msg){ st.state = state; st.msg = msg; if (state === "ok") st.at = Date.now(); paint(); }
  function paint(){
    const b = document.getElementById("cloud"), s = document.getElementById("drvstat");
    const label = {off:"☁ Drive", needs:"☁ Bağlan", busy:"☁ …", ok:"☁ ✓", err:"☁ !"}[st.state];
    if (b){ b.textContent = label; b.title = st.msg; b.style.color = st.state === "ok" ? "var(--pos)" : st.state === "err" ? "var(--neg)" : ""; }
    if (s) s.textContent = st.msg + (st.state === "ok" && st.at ? " · " + new Date(st.at).toLocaleTimeString("tr-TR") : "");
  }
  const gsi = () => gsiP || (gsiP = new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = res; s.onerror = () => { gsiP = null; rej(new Error("Google bağlantı kodu yüklenemedi (internet?)")); };
    document.head.appendChild(s);
  }));
  /* Safari: giriş penceresi dokunma anında, beklemeden açılmalı. Bu yüzden Google kodu önceden yüklenir
     ve requestAccessToken, await olmadan doğrudan çağrılır. */
  const gsiReady = () => !!(window.google && google.accounts && google.accounts.oauth2);
  function getToken(interactive){
    if (token && Date.now() < exp - 60000) return Promise.resolve(token);
    if (!clientId()) return Promise.reject(new Error("Önce Ayarlar'dan Google istemci kimliğini girin"));
    const start = () => new Promise((res, rej) => {
      const tc = google.accounts.oauth2.initTokenClient({client_id:clientId(), scope:SCOPE,
        callback: r => { if (r.error) return rej(new Error(r.error === "access_denied" ? "İzin verilmedi (Google hesabınız test kullanıcısı olarak ekli mi?)" : r.error)); token = r.access_token; exp = Date.now() + (r.expires_in || 3600) * 1000; res(token); },
        error_callback: e => rej(new Error(!e ? "Giriş gerekli" : e.type === "popup_closed" ? "Pencere kapatıldı"
          : e.type === "popup_failed_to_open" ? "Tarayıcı giriş penceresini engelledi. iPhone: Ayarlar → Safari → \"Açılır Pencereleri Engelle\"yi kapatın, sonra ☁'a tekrar dokunun" : "Giriş gerekli (" + e.type + ")"))});
      tc.requestAccessToken({prompt: interactive ? "" : "none"});
    });
    return gsiReady() ? start() : gsi().then(start);
  }
  async function api(path, opt = {}){
    const r = await fetch(API + path, {...opt, headers:{Authorization:"Bearer " + token, ...(opt.headers || {})}});
    if (r.status === 401){ token = null; throw new Error("Oturum süresi doldu"); }
    if (!r.ok) throw new Error("Drive hatası " + r.status);
    return r;
  }
  const findFile = async () => (await (await api(`/drive/v3/files?spaces=appDataFolder&q=${encodeURIComponent(`name='${FILE}'`)}&fields=files(id)&pageSize=1`)).json()).files[0] || null;
  const download = async id => (await api(`/drive/v3/files/${id}?alt=media`)).json();
  async function upload(id, data){
    const body = JSON.stringify(data);
    if (id) return api(`/upload/drive/v3/files/${id}?uploadType=media`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body});
    const bd = "defterim" + Date.now(), meta = JSON.stringify({name:FILE, parents:["appDataFolder"]});
    return api("/upload/drive/v3/files?uploadType=multipart", {method:"POST", headers:{"Content-Type":"multipart/related; boundary=" + bd},
      body:`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`});
  }
  async function sync(interactive, initial){
    if (!clientId() || busy) return;
    /* arka plan eşitlemesi giriş penceresi açmaz (odağı çalıp formları dondurabilir): süresi dolmuşsa yalnızca ☁ düğmesi uyarır */
    if (!interactive && !initial && !(token && Date.now() < exp - 60000)){ set("needs", "Drive'a bağlanmak için ☁ düğmesine dokunun"); return; }
    busy = true; lastRun = Date.now(); set("busy", "Eşitleniyor…");
    try {
      await getToken(interactive);
      const f = await findFile(), remote = f ? await download(f.id) : null;
      const L = (db.meta && db.meta.updated) || 0, R = (remote && remote.meta && remote.meta.updated) || 0, last = +lsGet(LAST) || 0;
      let act;
      if (!remote) act = "up";
      else if (isEmpty(Object.assign(blank(), db))) act = "down";
      else if (R === L) act = "none";
      else if (last && L === last) act = "down";                         /* yalnızca Drive değişmiş (saat karşılaştırması yok: cihaz saatleri farklı olabilir) */
      else if (last && R === last) act = "up";                          /* yalnızca bu cihaz değişmiş */
      else act = confirm(`Drive'daki veri (${tstr(R)}) ile bu cihazdaki veri (${tstr(L)}) farklı.\n\nTamam = Drive'daki veriyi bu cihaza al\nİptal = bu cihazdaki veriyi Drive'a yaz\n\nEski hâl her iki durumda da "geri al" olarak saklanır.`) ? "down" : "up";
      if (act === "down"){
        db = Object.assign(blank(), remote); persist(); lsSet(LAST, String((db.meta && db.meta.updated) || 0)); render();
      } else if (act === "up"){
        if (remote) lsSet(KEY + "_drivebak", JSON.stringify(remote));
        if (!db.meta){ db.meta = {updated:Date.now()}; persist(); }
        await upload(f && f.id, db); lsSet(LAST, String(db.meta.updated));
      } else lsSet(LAST, String(L));
      lsSet(CONN, "1"); set("ok", act === "down" ? "Drive'dan güncellendi" : act === "up" ? "Drive'a yazıldı" : "Güncel");
    } catch(e){
      const needLogin = interactive ? false : /Giriş gerekli|Oturum|interaction|popup/i.test(e.message);
      set(needLogin ? "needs" : "err", needLogin ? "Drive'a bağlanmak için ☁ düğmesine dokunun" : e.message);
      if (interactive) alert("Drive bağlantısı kurulamadı:\n" + e.message);
    } finally { busy = false; }
  }
  return {
    sync, clientId,
    queue(){ if (!clientId() || !lsGet(CONN)) return; clearTimeout(timer); timer = setTimeout(() => sync(false), 2000); },
    setClient(v){ v = (v || "").trim(); if (v) lsSet(CID, v); else { lsDel(CID); lsDel(CONN); } token = null; set(v ? "needs" : "off", v ? "Kaydedildi; bağlanmak için ☁ düğmesine dokunun" : "Bağlı değil"); },

/* ---------- hesap motoru ---------- */
/* Ay bazlı düzenleme: db.occ[anahtar] = {amount?, date?, done?, skip?}. Anahtar bir planlı kalemin tek bir ayını belirtir. */
const occ = k => (db.occ && db.occ[k]) || {};
function sched(base, key){
  const o = occ(key), e = {...base, key, defDate:base.date, planAmount:base.amount};
  if (o.date) e.date = o.date;
  if (o.amount != null) e.amount = o.amount;
  e.edited = o.amount != null || !!o.date; e.done = !!o.done; e.skipped = !!o.skip;
  if (e.skipped) e.amount = 0;
  return e;
}
function events(){
  const base = db.settings.base, tdy = todayISO(), ev = [];
  /* elle girilen işlem: tarihi geçtiyse gerçekleşmiş sayılır; t.done ile elle değiştirilebilir */
  db.tx.forEach(t => { const e = {...t, src:"tx", key:"tx:" + t.id, defDate:t.date, planAmount:t.amount, done: t.done === undefined ? t.date <= tdy : !!t.done};
    if (e.type !== "transfer") delete e.to;   /* eski kayıtlarda gider/gelirde kalan gizli "hedef" alanı */
    ev.push(e); });
  db.loans.forEach(l => { for (let k = 0; k < l.count; k++)
    ev.push(sched({date:dateIn(addM(l.start, k), l.day), type:"gider", amount:l.amount, account:l.account, cat:"Kredi", note:`${l.name} ${k+1}/${l.count}`, src:"loan", sid:l.id}, `loan:${l.id}:${k}`)); });
  db.taksit.forEach(t => { const per = t.total / t.count; for (let k = 0; k < t.count; k++)
    ev.push(sched({date:dateIn(addM(t.start, k), t.day), type:"gider", amount:per, account:t.card, cat:"Kart taksit", note:`${t.name} ${k+1}/${t.count}`, src:"taksit", sid:t.id}, `taksit:${t.id}:${k}`)); });
  db.rec.forEach(r => { const end = r.end || addM(r.start, 60);
    for (let ym = r.start; ym <= end; ym = addM(ym, 1))
      ev.push(sched({date:dateIn(ym, r.day), type:r.type, amount:r.amount, account:r.account, cat:r.cat || "Düzenli", note:r.name, src:"rec", sid:r.id}, `rec:${r.id}:${ym}`)); });
  const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  const out = ev.filter(e => e.date >= base).sort(byDate);
  const autoCards = db.accounts.filter(a => a.type === "kart" && a.due && db.accounts.some(x => x.id === a.payAcc && x.type !== "kart"));
  /* o dönemde kullanıcının kendi girdiği kart ödemeleri (transfer) planlanan ödemeden düşülür; çift sayım olmaz */
  const manual = {};   /* kart başına elle girilen ödemeler (bir kez gruplanır) */
  out.forEach(e => { if (e.src === "tx" && e.type === "transfer") (manual[e.to] = manual[e.to] || []).push(e); });
  const manualPaid = (a, from, to) => (manual[a.id] || []).reduce((s, e) => e.date >= from && e.date <= to ? s + e.amount : s, 0);
  const label = (a, mode, open) => `${open ? "Kart borcu ödemesi" : "Otomatik kart ödemesi"} (${mode}) · ${a.name}`;
  /* açılış borcu = kapanmış önceki ekstre: açılış ayındaki son ödeme gününde ödenir (tam ya da asgari) */
  autoCards.filter(a => a.opening < -0.005).forEach(a => {
    const bm = base.slice(0, 7); let d = dateIn(bm, a.due); if (d < base) d = dateIn(addM(bm, 1), a.due);
    const mode = a.payMode === "asgari" ? "asgari" : "tam", S0 = -a.opening, paid = manualPaid(a, base, d);
    const full = Math.max(0, S0 - paid), min = Math.max(0, S0 * minRate() - paid), amt = mode === "asgari" ? min : full;
    if (amt > 0.005) out.push(sched({date:d, type:"transfer", amount:amt, account:a.payAcc, to:a.id, cat:"", note:label(a, mode, true), src:"auto", mode, opening:true, minAmount:min, fullAmount:full}, `card:${a.id}:open`));
  });
  out.sort(byDate);
  /* ekstre borcu, son ödeme gününde ödeme hesabından otomatik düşer: tam borç ya da asgari */
  autoCards.forEach(a => {
    const mine = out.filter(e => e.account === a.id || (e.type === "transfer" && e.to === a.id)), added = [];
    let bal = a.opening || 0, i = 0;
    const adv = D => { for (; i < mine.length && mine[i].date <= D; i++){ const e = mine[i];
      if (e.type === "gelir") bal += e.amount; else if (e.type === "gider") bal -= e.amount; else bal += e.to === a.id ? e.amount : -e.amount; } };
    const op = out.find(e => e.opening && e.to === a.id), mode = a.payMode === "asgari" ? "asgari" : "tam";   /* açılış borcu ödemesi bu ekstreyi zaten karşılar */
    for (const [c, d] of statements(a, 60)){
      if (c < base || (op && d === op.date)) continue;
      adv(c); const S = Math.max(0, -bal), paid = manualPaid(a, addDays(c, 1), d);
      const full = Math.max(0, S - paid), min = Math.max(0, S * minRate() - paid), amt = mode === "asgari" ? min : full;
      adv(d);
      if (amt > 0.005){ const e = sched({date:d, type:"transfer", amount:amt, account:a.payAcc, to:a.id, cat:"", note:label(a, mode, false), src:"auto", mode, minAmount:min, fullAmount:full}, `card:${a.id}:${d}`); bal += e.amount; added.push(e); }
    }
    out.push(...added);
  });
  return out.sort(byDate);
}
/* bir planlı kalemin ayını değiştir / onayla; boş kalırsa kaydı sil */
function setOcc(key, patch){
  db.occ = db.occ || {};
  const o = {...(db.occ[key] || {}), ...patch};
  ["amount", "date", "done", "skip"].forEach(k => { if (o[k] === undefined || o[k] === null || o[k] === false || o[k] === "") delete o[k]; });
  if (Object.keys(o).length) db.occ[key] = o; else delete db.occ[key];
}
const minRate = () => (db.settings.minRate ?? 40) / 100;
/* kartın (kesim tarihi, son ödeme tarihi) çiftleri; dönemler sırayla gelir */
const stCache = new Map();   /* ekstre takvimi kart ayarına bağlıdır; her çağrıda yeniden hesaplamamak için saklanır */
function statements(a, n){
  const cutDay = a.cut || a.due, key = a.id + "|" + cutDay + "|" + a.due + "|" + db.settings.base;
  let all = stCache.get(key);
  if (!all || all.length < n){
    all = []; let ym = addM(db.settings.base.slice(0, 7), -1);
    for (let k = 0; k < Math.max(n, 120); k++, ym = addM(ym, 1)){
      const c = dateIn(ym, cutDay), d = a.due > cutDay ? dateIn(ym, a.due) : dateIn(addM(ym, 1), a.due);
      all.push([c, d]);
    }
    if (stCache.size > 200) stCache.clear();
    stCache.set(key, all);
  }
  return all.length > n ? all.slice(0, n) : all;
}
/* şu an ödenmesi gereken ekstre: son ödeme günü bugünden önce olmayan ilk dönem */
function stmt(E, a){
  if (!a.due) return null;
  const t = todayISO(), [c, d] = statements(a, 120).find(([, d]) => d >= t) || [];
  if (!d) return null;
  const S = Math.max(0, -balancesAt(E, c)[a.id]);
  const paid = E.filter(e => e.type === "transfer" && e.to === a.id && e.date > c && e.date <= t).reduce((s, e) => s + e.amount, 0);
  const min = S * minRate(), liq = liquid(balancesAt(E, addDays(d, -1)));
  return {cut:c, due:d, S, paid, min, minLeft:Math.max(0, min - paid), fullLeft:Math.max(0, S - paid), liq};
}
/* actual=true: yalnızca "gerçekleşti" onaylı kalemler sayılır */
function balancesAt(E, D, actual){
  const b = {}; db.accounts.forEach(a => b[a.id] = a.opening || 0);
  for (const e of E){
    if (e.date > D) break;
    if (actual && !e.done) continue;
    if (e.type === "gelir" && e.account in b) b[e.account] += e.amount;
    else if (e.type === "gider" && e.account in b) b[e.account] -= e.amount;
    else if (e.type === "transfer"){ if (e.account in b) b[e.account] -= e.amount; if (e.to in b) b[e.to] += e.amount; }
  }
  return b;
}
const isCard = id => (db.accounts.find(a => a.id === id) || {}).type === "kart";
const liquid = b => db.accounts.filter(a => a.type !== "kart").reduce((s, a) => s + (b[a.id] || 0), 0);
const debt = b => -db.accounts.filter(a => a.type === "kart").reduce((s, a) => s + (b[a.id] || 0), 0);
const sumM = (E, ym, type) => E.filter(e => e.type === type && e.date.startsWith(ym)).reduce((s, e) => s + e.amount, 0);
const accName = id => (db.accounts.find(a => a.id === id) || {name:"(silinmiş)"}).name;

function loanStatus(l){
  const t = todayISO(); let paid = 0, next = null;
  for (let k = 0; k < l.count; k++){ const d = dateIn(addM(l.start, k), l.day); if (d <= t) paid++; else if (!next) next = d; }
  return {paid, left: l.count - paid, next, leftSum: (l.count - paid) * l.amount};
}
function taksitStatus(x){
  const t = todayISO(), per = x.total / x.count; let paid = 0, next = null;
  for (let k = 0; k < x.count; k++){ const d = dateIn(addM(x.start, k), x.day); if (d <= t) paid++; else if (!next) next = d; }
  return {paid, left: x.count - paid, next, per, leftSum: (x.count - paid) * per};
}
/* seçili ayın ödemeleri (kasadan çıkanlar) ve her ödeme sonrası kasa; kart ödemeleri ekstre/otomatik ödeme olaylarından gelir */
function monthPayments(E, m){
  const liq = new Set(db.accounts.filter(a => a.type !== "kart").map(a => a.id)), t = todayISO(), rows = [];
  let run = liquid(balancesAt(E, endOf(addM(m, -1))));
  E.filter(e => e.date.startsWith(m)).forEach(e => {
    if (e.skipped) return;
    let d = 0;
    if (e.type === "gelir" && liq.has(e.account)) d = e.amount;
    else if (e.type === "gider" && liq.has(e.account)) d = -e.amount;
    else if (e.type === "transfer") d = (liq.has(e.to) ? e.amount : 0) - (liq.has(e.account) ? e.amount : 0);
    run += d;
    if (e.type === "gider" && !liq.has(e.account)){   /* kart harcaması: kasadan çıkmaz, ekstre ödenince çıkar */
      const a = db.accounts.find(x => x.id === e.account), p = a && a.due ? statements(a, 120).find(([c]) => c >= e.date) : null;
      rows.push({date:e.date, done:e.done, amount:e.amount, kasa:run, card:true, what:e.note || e.cat || "Kart harcaması",
        acc:accName(e.account) + (p ? " · karttan, ekstre ödemesi " + trDate(p[1]) : " · karttan")});
      return;
    }
    if (d >= -0.005) return;
    const toCard = e.type === "transfer";
    rows.push({date:e.date, done:e.done, amount:-d, kasa:run,
      what: e.src === "auto" ? `${e.opening ? "Kart borcu" : "Kart ekstresi"} (${e.mode === "asgari" ? "asgari" : "tam"} ödeme)` : toCard ? (e.note || "Kart ödemesi") : (e.note || e.cat || "Gider"),
      acc: toCard ? accName(e.to) : accName(e.account)});
  });
  /* ödeme hesabı tanımsız kartlar: kasadan düşülmez, bilgi olarak gösterilir */
  db.accounts.filter(a => a.type === "kart" && a.due && !db.accounts.some(x => x.id === a.payAcc && x.type !== "kart")).forEach(a => {
    const p = statements(a, 120).find(([, d]) => d.startsWith(m)); if (!p) return;
    const S = Math.max(0, -balancesAt(E, p[0])[a.id]), amt = a.payMode === "asgari" ? S * minRate() : S;
    if (amt > 0.005) rows.push({date:p[1], done:p[1] <= t, amount:amt, kasa:null, what:`Kart ekstresi (${a.payMode === "asgari" ? "asgari" : "tam"} ödeme)`, acc:a.name + " · ödeme hesabı tanımsız"});
  });
  return rows.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}

/* ---------- grafik (SVG) ---------- */
function niceStep(x){ if (x <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function chart({labels, bars = [], lines = [], h = 250}){
  const W = 760, L = 50, R = 10, T = 14, B = 26, pw = W - L - R, ph = h - T - B;
  const all = [0, ...bars.flatMap(b => b.data), ...lines.flatMap(l => l.data)];
  let mn = Math.min(...all), mx = Math.max(...all); if (mx === mn) mx = mn + 1;
  const step = niceStep((mx - mn) / 4); mn = Math.floor(mn / step) * step; mx = Math.ceil(mx / step) * step;
  const y = v => T + ph * (1 - (v - mn) / (mx - mn)), n = labels.length, gw = pw / n;
  let s = `<svg viewBox="0 0 ${W} ${h}" class="chart" role="img" aria-label="grafik">`;
  const cnt = Math.round((mx - mn) / step);
  for (let i = 0; i <= cnt; i++){ const v = mn + i * step, yy = y(v);
    s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--rule)" stroke-width="${Math.abs(v)<1e-9?1.6:.7}"${Math.abs(v)<1e-9?' style="stroke:var(--ink)"':""}/><text x="${L-6}" y="${yy+4}" text-anchor="end">${short(v)}</text>`; }
  const bw = Math.min(28, gw * .72 / Math.max(bars.length, 1));
  bars.forEach((b, j) => b.data.forEach((v, i) => {
    const x = L + gw * i + gw / 2 - bw * bars.length / 2 + j * bw, y0 = y(Math.max(v, 0)), hh = Math.max(Math.abs(y(v) - y(0)), v ? 1 : 0);
    const col = b.colors ? b.colors[i] : b.color;
    s += `<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" style="fill:${col}"><title>${labels[i]} · ${b.name}: ${fmt(v)}</title></rect>`;
    if (b.labels && v) s += `<text x="${(x+bw/2-1).toFixed(1)}" y="${(v>=0?y0-4:y0+hh+11).toFixed(1)}" text-anchor="middle">${short(v)}</text>`;
  }));
  lines.forEach(l => {
    const pts = l.data.map((v, i) => `${(L + gw * i + gw / 2).toFixed(1)},${y(v).toFixed(1)}`);
    s += `<polyline points="${pts.join(" ")}" fill="none" style="stroke:${l.color}" stroke-width="2.4" ${l.dash ? 'stroke-dasharray="6 4"' : ""} stroke-linejoin="round"/>`;
    if (!l.dash) l.data.forEach((v, i) => s += `<circle cx="${(L + gw * i + gw / 2).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" style="fill:${l.color}"><title>${labels[i]} · ${l.name}: ${fmt(v)}</title></circle>`);
  });
  labels.forEach((t, i) => s += `<text x="${(L + gw * i + gw / 2).toFixed(1)}" y="${h - 8}" text-anchor="middle">${t}</text>`);
  const lg = [...bars, ...lines].map(b => `<span><i style="background:${b.colors ? "var(--pos)" : b.color}"></i>${b.legend || b.name}</span>`).join("");
  return s + `</svg><div class="legend">${lg}</div>`;
}

/* ---------- görünümler ---------- */
function kpi(t, v, sub, c){ return `<div class="card kpi"><small>${t}</small><b class="${c || ""}">${v}</b>${sub ? `<i>${sub}</i>` : ""}</div>`; }

/* ay içi günlük nakit akışı: yalnızca banka + nakit hesapları (kasa) */
function dailyFlow(E, m, actual){
  const liq = new Set(db.accounts.filter(a => a.type !== "kart").map(a => a.id)), n = dim(m);
  const inn = Array(n).fill(0), out = Array(n).fill(0), card = Array(n).fill(0);
  E.filter(e => e.date.startsWith(m) && (!actual || e.done)).forEach(e => { const i = +e.date.slice(8) - 1;
    if (e.type === "gider" && !liq.has(e.account)) card[i] -= e.amount;
    else if (e.type === "gelir" && liq.has(e.account)) inn[i] += e.amount;
    else if (e.type === "gider" && liq.has(e.account)) out[i] -= e.amount;
    else if (e.type === "transfer"){ if (liq.has(e.to) && !liq.has(e.account)) inn[i] += e.amount; if (liq.has(e.account) && !liq.has(e.to)) out[i] -= e.amount; } });
  let run = liquid(balancesAt(E, endOf(addM(m, -1)), actual)), lo = {v:Infinity, d:0};
  const bal = inn.map((x, i) => { run += x + out[i]; if (run < lo.v) lo = {v:run, d:i + 1}; return run; });
  return {labels:inn.map((_, i) => String(i + 1)), inn, out, card, bal, minTxt:`en düşük kasa: ${fmt(lo.v)} (${lo.d} ${MONTHS[+m.slice(5) - 1]})`};
}

    Kart borcu ödemesi <b>gider sayılmaz</b>: kasadan çıkar ama borcu aynı tutarda azaltır. Bu yüzden kasa düşerken birikim artıda görünebilir; kasanın düşmesinin sebebi, önceki aylardan kalan kart borcunu ödemenizdir (${fmt(bPay)}).</p></section>`;

  const upAll = monthPayments(E, m), up = upAll, cashRows = upAll.filter(u => !u.card);

  return `

    ${kpi("Gelir", fmt(cur.inc), lbl(m), "pos")}

  <div class="grid">   <!-- tek sütun: ödeme tablosu geniş olduğu için tam genişlikte, tek satırda -->

      <p class="muted" style="margin:8px 0 0;font-size:12px">Kasadan çıkan, ödenmemiş kalan: <b class="neg">${fmt(upLeft)}</b>. Kasa, o ana kadarki gelirler ve ödemeler dahil banka + nakit toplamıdır.${cardSum ? ` Karta yansıyan harcama: <b>${fmt(cardSum)}</b> (henüz yapılmamış: ${fmt(cardLeft)}); kasadan, ilgili ekstre ödenince çıkar ve o ayın listesinde "Kart ekstresi" olarak görünür.` : ""}</p>` : `<div class="empty">Bu ay ödeme yok</div>`}
    </section>
  </div>

    <p class="muted" style="margin:8px 0 0;font-size:12px">Ekstre borcu: hesap kesim günündeki borçtur (kesim günü tanımlı değilse son ödeme günü kullanılır). Asgari ödeme = ekstre borcunun %${Math.round(minRate() * 100)}'i, kesimden sonra yapılan ödemeler düşülür. Faiz hesaba katılmaz.</p>

  <div class="grid kpis" style="margin-top:14px">
    ${kpi(lbl(m) + " sonu kasa (plan)", fmt(daily.bal[daily.bal.length - 1]), "plana göre ay sonunda kasada kalacak", cls(daily.bal[daily.bal.length - 1]))}
    ${kpi("Gerçekleşen kasa", actNow === null ? "—" : fmt(actNow), m === curM ? "bugün, onaylanan işlemlere göre" : m > curM ? "henüz başlamadı" : "ay sonu, onaylananlara göre", actNow === null ? "" : cls(actNow))}

  </div>

    ${chart({labels:daily.labels, h:260, bars:[{name:"Giriş", color:"var(--pos)", data:daily.inn}, {name:"Çıkış", color:"var(--neg)", data:daily.out}, ...(daily.card.some(v => v) ? [{name:"Kart harcaması (kasadan çıkmaz)", color:"var(--accent)", data:daily.card}] : [])], lines:[{name:"Plan kasa", color:"var(--ink)", data:daily.bal}]})}

/* Seçili kartın ekstre dönemleri: dönem harcaması, ekstre borcu (kesim günündeki toplam borç), ödeme ve kalan */
function cardPeriods(E, a){
  if (!a.due) return `<p class="muted" style="font-size:13px">Ekstre dönemlerini görmek için kartın hesap kesim ve son ödeme günlerini girin (Hesaplar → Düzenle).</p>`;
  const st = statements(a, 120), t = todayISO(), live = E.filter(e => !e.skipped);
  let i = st.findIndex(([, d]) => d >= t); if (i < 0) i = st.length - 1;
  const rows = [];
  for (let k = Math.max(0, i - 2); k <= Math.min(st.length - 1, i + 2); k++){
    const [c, d] = st[k], start = k > 0 ? addDays(st[k - 1][0], 1) : db.settings.base;
    if (d < db.settings.base) continue;   /* son ödeme günü başlangıç tarihinden önce olan dönemler gösterilmez */
    const spend = live.filter(e => e.type === "gider" && e.account === a.id && e.date >= start && e.date <= c).reduce((s, e) => s + e.amount, 0);
    const S0 = Math.max(0, -balancesAt(E, c)[a.id]);
    /* bu ekstreye yapılan ödemeler: kesimden sonraki kesime kadar (son ödeme gününden sonra yapılan gecikmeli ödemeler de dahil) */
    const cNext = k + 1 < st.length ? st[k + 1][0] : d;
    const pays = live.filter(e => e.type === "transfer" && e.to === a.id && e.date > c && e.date <= cNext);
    const paid = pays.reduce((s, e) => s + e.amount, 0), late = pays.filter(e => e.date > d).reduce((s, e) => s + e.amount, 0);
    const tag = c < t ? "kesildi" : start <= t ? "açık dönem" : "gelecek";
    rows.push(`<tr${tag === "açık dönem" ? ' style="background:var(--accent-soft)"' : ""}><td class="l">${start > c ? "Açılıştan önceki dönem" : trDate(start) + " – " + trDate(c)} ${start > c ? "(" + trDate(c) + ")" : ""}<span class="tag">${tag}</span></td><td>${fmt(spend)}</td><td>${fmt(S0)}</td><td>${trDate(d)}</td><td>${fmt(paid)}${late > 0.005 ? `<br><span class="muted">son ödeme gününden sonra: ${fmt(late)}</span>` : ""}</td><td class="${S0 - paid > 0.005 ? "neg" : "pos"}">${fmt(Math.max(0, S0 - paid))}</td></tr>`);
  }
  return `<div class="wrap" style="margin-bottom:12px"><table><tr><th class="l">Ekstre dönemi</th><th>Dönem harcaması</th><th>Ekstre borcu</th><th>Son ödeme</th><th>Ödenen</th><th>Kalan</th></tr>${rows.join("")}</table></div>
    <p class="muted" style="margin:-4px 0 12px;font-size:12px">Dönem harcaması: o dönemde karta yapılan harcama ve taksitler. Ekstre borcu: kesim günündeki toplam borç (önceki dönemden devreden dahil). Ödenen: kesimden sonraki kesime kadar yapılan tüm ödemeler; son ödeme gününden sonrakiler ayrıca belirtilir. Kalan tutar, bir sonraki ekstreye devreder.</p>`;
}

/* İşlemler = ödeme planı: her satır planlı bir kalemdir; ayı için düzeltilebilir ve "gerçekleşti" diye onaylanabilir */
function viewIslem(E){
  const m = S.m, t = todayISO(), acc = db.accounts.some(a => a.id === S.acc) ? S.acc : "", accObj = db.accounts.find(a => a.id === acc);
  const list = E.filter(e => e.date.startsWith(m) && (!acc || e.account === acc || (e.type === "transfer" && e.to === acc)));   /* "hedef" yalnızca transferde anlamlı */
  const filterBar = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
    <label class="muted" for="accf" style="font-size:13px">Hesap / kart:</label>
    <select id="accf" onchange="S.acc=this.value;render()" style="font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)">
      <option value="">Tümü</option>
      <optgroup label="Kredi kartları">${db.accounts.filter(a => a.type === "kart").map(a => `<option value="${a.id}"${a.id === acc ? " selected" : ""}>${esc(a.name)}</option>`).join("")}</optgroup>
      <optgroup label="Banka ve nakit">${db.accounts.filter(a => a.type !== "kart").map(a => `<option value="${a.id}"${a.id === acc ? " selected" : ""}>${esc(a.name)}</option>`).join("")}</optgroup>
    </select>
    ${accObj ? `<button class="primary" onclick="addTx('${acc}')">+ ${accObj.type === "kart" ? "Bu karta harcama ekle" : "Bu hesaba işlem ekle"}</button>` : ""}</div>`;
  const periods = accObj && accObj.type === "kart" ? cardPeriods(E, accObj) : "";
  const live = list.filter(e => !e.skipped), sum = (rows, type) => rows.filter(e => e.type === type).reduce((s, e) => s + e.amount, 0);
  const done = live.filter(e => e.done), pending = list.filter(e => e.src !== "tx" && !e.done && !e.skipped && e.date <= t);
  const stat = e => e.skipped ? '<span class="tag" style="background:var(--rule);color:var(--mute)">iptal</span>'
    : e.done ? '<span class="tag" style="background:color-mix(in srgb,var(--pos) 18%,var(--card));color:var(--pos)">gerçekleşti</span>'
    : e.date < t ? '<span class="tag" style="background:color-mix(in srgb,var(--neg) 16%,var(--card));color:var(--neg)">bekliyor</span>' : '<span class="tag">plan</span>';
  const rows = list.map(e => {
    const sign = e.type === "gelir" ? "+" : e.type === "gider" ? "−" : "↔", c = e.type === "gelir" ? "pos" : e.type === "gider" ? "neg" : "";
    const what = e.src === "auto" ? `${e.opening ? "Kart borcu" : "Kart ekstresi"} (${e.mode === "asgari" ? "asgari" : "tam"} ödeme)` : (e.note || e.cat || "");
    const acc = esc(accName(e.account)) + (e.type === "transfer" ? " → " + esc(accName(e.to)) : "") + (e.src === "tx" && e.type === "gider" && isCard(e.account) ? " · karta harcama (borcu artırır)" : "");
    const amt = e.skipped ? `<s class="muted">${fmt(e.planAmount)}</s>` : `${sign} ${fmt(e.amount)}` + (e.edited && Math.round(e.amount * 100) !== Math.round(e.planAmount * 100) ? `<br><span class="muted">plan: ${fmt(e.planAmount)}</span>` : "");
    const edit = e.src === "tx" ? `editTx('${e.id}')` : `editOcc('${e.key}')`;
    return `<tr${e.skipped ? ' style="opacity:.55"' : ""}><td>${trDate(e.date)}${e.edited && e.date !== e.defDate ? '<br><span class="muted">plan: ' + trDate(e.defDate) + "</span>" : ""}</td>
      <td class="l">${esc(what)}${e.src === "tx" ? `<span class="muted"> ${esc(e.cat || "")}</span>` : ""}<br><span class="muted">${acc}</span></td>
      <td class="${e.skipped ? "" : c}">${amt}</td><td>${stat(e)}</td>
      <td>${e.skipped ? "" : `<button class="mini" onclick="toggleDone('${e.key}')">${e.done ? "Geri al" : "Onayla"}</button> `}<button class="mini" onclick="${edit}">Düzenle</button>${e.src === "tx" ? ` <button class="mini del" onclick="delItem('tx','${e.id}')">Sil</button>` : ""}</td></tr>`; }).join("");
  return `<section class="card"><h2>${lbl(m)} ödeme planı${accObj ? " · " + esc(accObj.name) : ""}</h2>
    ${filterBar}${periods}
    <div class="grid kpis" style="margin-bottom:12px">
      ${kpi("Plan gelir", fmt(sum(live, "gelir")), "gerçekleşen: " + fmt(sum(done, "gelir")), "pos")}
      ${kpi("Plan gider", fmt(sum(live, "gider")), "gerçekleşen: " + fmt(sum(done, "gider")), "neg")}
      ${kpi("Onay bekleyen", String(pending.length), "tarihi geçmiş, onaylanmamış")}
    </div>
    <p class="muted" style="margin-top:0;font-size:13px">Her satır plana göre hesaplanır. Bir ay için tutarı ya da tarihi <b>Düzenle</b> ile değiştirebilir (ör. kart borcunun tamamını ya da %40'tan fazlasını ödemek), ödeme yapılınca <b>Onayla</b> ile gerçekleşti işaretleyebilirsiniz. Değişiklikler hesapları, kart borçlarını ve sonraki ayları günceller.</p>
    ${pending.length ? `<button class="ghost" onclick="confirmPast()">Tarihi geçen ${pending.length} kalemi gerçekleşti say</button>` : ""}
  ${list.length ? `<div class="wrap"><table><tr><th>Tarih</th><th class="l">Açıklama</th><th>Tutar</th><th>Durum</th><th></th></tr>${rows}</table></div>` : `<div class="empty">Bu ay işlem yok.</div>`}</section>`;
}

/* bir planlı kalemin durumunu değiştir */
function toggleDone(key){
  if (key.startsWith("tx:")){ const t = db.tx.find(x => "tx:" + x.id === key); if (!t) return; const e = events().find(x => x.key === key); t.done = !e.done; }
  else setOcc(key, {done: !occ(key).done});
  save(); render();
}
function confirmPast(){

function editOcc(key){

  const d = $("#dlg"), card = e.src === "auto", cur = e.skipped ? e.planAmount : e.amount;
  const title = e.src === "auto" ? `${e.opening ? "Kart borcu" : "Kart ekstresi"} · ${accName(e.to)}` : (e.note || e.cat);

    <label class="f">Tutar (₺) — işlem yazabilirsiniz: 1750*2<input type="text" inputmode="decimal" data-calc name="amount" value="${fmtPlain(cur)}" autocomplete="off" required></label>
    ${card ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px">
      <button type="button" class="mini" data-fill="${(e.minAmount || 0).toFixed(2)}">Asgari %${Math.round(minRate() * 100)}: ${fmt(e.minAmount || 0)}</button>
      <button type="button" class="mini" data-fill="${(e.fullAmount || 0).toFixed(2)}">Tam borç: ${fmt(e.fullAmount || 0)}</button></div>` : ""}
    <label class="f">Durum<select name="state"><option value="plan">Plan (henüz ödenmedi)</option><option value="done">Gerçekleşti (ödendi / tahsil edildi)</option><option value="skip">Bu ay iptal / yapılmadı</option></select></label>
    <div class="row"><button type="button" class="ghost" id="oc_reset">Plana dön</button><button type="button" class="ghost" id="oc_x">Vazgeç</button><button class="primary">Kaydet</button></div></form>`;
  const fm = d.querySelector("form");
  fm.elements.state.value = e.skipped ? "skip" : e.done ? "done" : "plan";
  d.querySelectorAll("[data-fill]").forEach(b => b.onclick = () => { fm.elements.amount.value = b.dataset.fill; });
  $("#oc_x").onclick = () => d.close();
  $("#oc_reset").onclick = () => { if (confirm("Bu ayın değişiklikleri silinip plana dönülsün mü?")){ setOcc(key, {amount:null, date:null, done:false, skip:false}); d.close(); save(); render(); } };
  fm.onsubmit = ev => { ev.preventDefault();
    const amount = calcEval(fm.elements.amount.value), date = fm.elements.date.value, st = fm.elements.state.value;
    if (!(amount >= 0) || !date) return alert("Tutar ve tarih gerekli.");
    setOcc(key, {amount: Math.round(amount * 100) !== Math.round(e.planAmount * 100) ? amount : null, date: date !== e.defDate ? date : null, done: st === "done", skip: st === "skip"});
    d.close(); save(); render(); };
  d.showModal();
}

  const kasaNow = liquid(now), kasaEnd = liquid(end), debtNow = debt(now), debtEnd = debt(end);

function viewPlan(E){
  const g = db.settings, start = g.base.slice(0, 7), nowM = thisYM();
  const months = Array.from({length:12}, (_, i) => addM(start, i));
  let cum = 0;
  const rows = months.map((x, i) => { const inc = sumM(E, x, "gelir"), exp = sumM(E, x, "gider"), net = inc - exp; cum += net;
    return {x, inc, exp, net, cum, goal:g.goalMonthly * (i + 1)}; });
  const avg = rows.reduce((s, r) => s + r.net, 0) / 12, last = rows[11];
  let eta = "";
  if (g.goalTotal > 0){ const doneNow = rows.find(r => r.cum >= g.goalTotal);
    eta = doneNow ? `Hedef <b>${fmt(g.goalTotal)}</b> birikime <b>${lbl(doneNow.x)}</b> ayında ulaşılıyor.` : avg > 0 ? `Mevcut gidişle ${fmt(g.goalTotal)} hedefine yaklaşık <b>${Math.ceil((g.goalTotal - last.cum) / avg)} ay</b> daha gerekir (12 ay sonunda ${fmt(last.cum)}).` : `Aylık ortalama net ${fmt(avg)}; bu gidişle hedefe ulaşılamaz.`; }
  return `<div class="grid kpis">
    ${kpi("Ortalama aylık birikim", fmt(avg), "12 aylık plan", cls(avg))}
    ${kpi("Aylık hedef", fmt(g.goalMonthly), "Ayarlar'dan değiştirin")}
    ${kpi("12 ay sonu birikim", fmt(last.cum), lbl(start) + " başlangıçlı", cls(last.cum))}
    ${kpi("Toplam hedef", g.goalTotal ? fmt(g.goalTotal) : "—", "")}
  </div>
  ${eta ? `<div class="ok" style="margin-top:14px">${eta}</div>` : ""}
  <section class="card" style="margin-top:14px"><h2>Birikim: gerçekleşen / planlanan ve hedef</h2>
    ${chart({labels:months.map(lbl), bars:[{name:"Aylık net", color:"var(--accent)", data:rows.map(r => r.net)}], lines:[{name:"Kümülatif birikim", color:"var(--ink)", data:rows.map(r => r.cum)}, ...(g.goalMonthly ? [{name:"Hedef çizgisi", color:"var(--pos)", dash:true, data:rows.map(r => r.goal)}] : [])]})}
  </section>
  <section class="card" style="margin-top:14px"><h2>Aylık plan</h2><div class="wrap"><table>
    <tr><th>Ay</th><th>Gelir</th><th>Gider</th><th>Birikim</th><th>Hedef fark</th><th>Kümülatif</th></tr>
    ${rows.map(r => `<tr><td>${lbl(r.x)}${r.x === nowM ? '<span class="tag">bu ay</span>' : ""}</td><td>${fmt(r.inc)}</td><td>${fmt(r.exp)}</td><td class="${cls(r.net)}">${fmt(r.net)}</td><td class="${cls(r.net - g.goalMonthly)}">${g.goalMonthly ? fmt(r.net - g.goalMonthly) : "—"}</td><td class="${cls(r.cum)}">${fmt(r.cum)}</td></tr>`).join("")}
  </table></div></section>`;
}

function form(title, fields, vals, onSave){
  const d = $("#dlg");
  d.innerHTML = `<form autocomplete="off" data-lpignore="true" data-1p-ignore><h3>${title}</h3>${fields.map(f => {
    const v = vals[f.k] ?? "";
    const inp = f.t === "select" ? `<select name="${f.k}">${f.opts.map(([o, l]) => `<option value="${esc(o)}"${o == v ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`
      : f.t === "calc" ? `<input name="${f.k}" type="text" inputmode="decimal" data-calc value="${v === "" ? "" : fmtPlain(+v)}" placeholder="örn. 1750*2" autocomplete="off"${f.req ? " required" : ""}>`
      : `<input name="${f.k}" type="${f.t}" value="${esc(v)}" autocomplete="off"${f.t === "number" ? ' step="0.01"' : ""}${f.list ? ` list="${f.list}"` : ""}${f.req ? " required" : ""}>`;
    return `<label class="f" data-k="${f.k}">${f.l}${inp}</label>`; }).join("")}
    <datalist id="cats">${["Maaş","Ek gelir","Market","Fatura","Kira","Ulaşım","Sağlık","Eğitim","Eğlence","Giyim","Yemek","Diğer"].map(c => `<option>${c}</option>`).join("")}</datalist>
    <div class="row"><button type="button" class="ghost" id="cx">Vazgeç</button><button class="primary">Kaydet</button></div></form>`;
  const fm = d.querySelector("form");
  const toggle = () => fields.forEach(f => { if (f.when){ const cur = fm.elements[f.when.k].value; fm.querySelector(`[data-k="${f.k}"]`).style.display = f.when.v.includes(cur) ? "" : "none"; } });
  fm.addEventListener("change", toggle); toggle();
  $("#cx").onclick = () => d.close();
  fm.onsubmit = e => { e.preventDefault(); const o = {}; let bad = null;
    fields.forEach(f => { const el = fm.elements[f.k];
      if (f.t === "calc"){ const v = calcEval(el.value); if (el.value.trim() && isNaN(v)) bad = bad || f.l; o[f.k] = isNaN(v) ? 0 : v; }
      else o[f.k] = f.t === "number" ? (parseFloat(String(el.value).replace(",", ".")) || 0) : el.value; });
    if (bad) return alert(`"${bad}" alanındaki işlem anlaşılamadı. Örnek: 1750*2 ya da (1200+300)/3`);
    if (onSave(o) === false) return;   /* doğrulama başarısızsa pencere açık kalır */
    d.close(); save(); render(); };
  d.showModal();
}

    {k:"due", l:"Son ödeme günü", t:"number", when:{k:"type", v:["kart"]}},
    {k:"payAcc", l:"Otomatik ödeme hesabı (borç son ödeme gününde buradan düşer)", t:"select", opts:[["", "Yok — kart borcunu kasa tahminine katma"], ...accOpts(x => x.type !== "kart" && x.id !== id)], when:{k:"type", v:["kart"]}},
    {k:"payMode", l:"Otomatik ödeme tutarı (tahminlerde kullanılır)", t:"select", opts:[["tam","Ekstre borcunun tamamı"],["asgari","Asgari ödeme"]], when:{k:"type", v:["kart"]}}], v,
    o => { const rec = {id:id || uid(), name:o.name.trim() || "Hesap", type:o.type, opening: o.type === "kart" ? -Math.abs(o.opening) : o.opening, limit:o.limit, cut:o.cut, due:o.due, payAcc: o.type === "kart" ? o.payAcc : "", payMode:o.payMode};
      if (id) Object.assign(a, rec); else db.accounts.push(rec); });
}
const warn = m => { alert(m); return false; };   /* uyarı göster, formu açık tut */
function txForm(t, onSave){
  if (needAcc()) return;
  form(t.id ? "İşlemi düzenle" : "Yeni işlem", [
    {k:"type", l:"Tür", t:"select", opts:[["gider","Gider (harcama)"],["gelir","Gelir"],["kartodeme","Kart borcu ödemesi (bankadan karta)"],["transfer","Hesaplar arası transfer"]]},
    {k:"date", l:"Tarih", t:"date", req:1},
    {k:"amount", l:"Tutar (₺) — işlem yazabilirsiniz: 1750*2", t:"calc", req:1},
    {k:"account", l:"Harcanan / gelirin yattığı hesap veya kart", t:"select", opts:accOpts(), when:{k:"type", v:["gider","gelir"]}},
    {k:"srcBank", l:"Ödemenin yapılacağı hesap (paranın çıkacağı yer)", t:"select", opts:accOpts(a => a.type !== "kart"), when:{k:"type", v:["kartodeme"]}},
    {k:"toCard", l:"Ödenecek kredi kartı", t:"select", opts:accOpts(a => a.type === "kart"), when:{k:"type", v:["kartodeme"]}},
    {k:"src", l:"Kaynak hesap", t:"select", opts:accOpts(), when:{k:"type", v:["transfer"]}},
    {k:"to", l:"Hedef hesap", t:"select", opts:accOpts(), when:{k:"type", v:["transfer"]}},
    {k:"cat", l:"Kategori", t:"text", list:"cats", when:{k:"type", v:["gelir","gider"]}},
    {k:"note", l:"Açıklama", t:"text"},
    {k:"doneSel", l:"Durum", t:"select", opts:[["auto","Otomatik (tarihi geldiyse gerçekleşti)"],["1","Gerçekleşti"],["0","Plan (henüz olmadı)"]]}],
    (() => { const pay = t.type === "transfer" && isCard(t.to), firstBank = db.accounts.find(a => a.type !== "kart"), firstCard = db.accounts.find(a => a.type === "kart");
      return {...t, type: pay ? "kartodeme" : t.type, srcBank: pay ? t.account : (firstBank || {}).id, toCard: pay ? t.to : (firstCard || {}).id,
        src: t.type === "transfer" ? t.account : (db.accounts[0] || {}).id, doneSel: t.done === undefined ? "auto" : t.done ? "1" : "0"}; })(),
    ({doneSel, srcBank, toCard, src, ...o}) => {
      if (doneSel === "1") o.done = true; else if (doneSel === "0") o.done = false;
      if (o.type === "gider" || o.type === "gelir") delete o.to;   /* hedef hesap yalnızca transfer ve kart ödemesinde kullanılır */
      if (o.type === "kartodeme"){
        if (!srcBank || !toCard) return warn("Kart ödemesi için bir banka/nakit hesabı ve bir kredi kartı gerekli.");
        o.type = "transfer"; o.account = srcBank; o.to = toCard;
      } else if (o.type === "transfer"){
        o.account = src;
        if (o.to === o.account) return warn("Kaynak ve hedef aynı olamaz.");
        if (isCard(o.account) && !confirm("Kaynak bir kredi kartı: bu, karttan nakit çekmek sayılır ve kartın borcunu artırır. Devam edilsin mi?")) return false;
      } else if (o.type === "gider" && isCard(o.account) && /ödeme|odeme|borç|borc|yatır|yatir|kapat/i.test((o.note || "") + " " + (o.cat || ""))){
        /* "ödeme" gibi bir açıklamayla karta gider girilmişse büyük olasılıkla kart borcu ödemesidir */
        if (confirm("Bu kayıt karta yapılmış bir HARCAMA olarak girildi ve kartın borcunu ARTIRIR.\nKart borcunu ödüyorsanız Tamam'a basın: kart ödemesine çevrilir (para bir banka hesabından düşer).")){
          const card = db.accounts.find(a => a.id === o.account), bank = db.accounts.find(a => a.id === card.payAcc) || db.accounts.find(a => a.type !== "kart");
          if (!bank) return warn("Önce bir banka hesabı ekleyin.");
          o.type = "transfer"; o.to = o.account; o.account = bank.id; delete o.cat;
          alert(`Kart ödemesi olarak kaydedildi. Para "${bank.name}" hesabından düşer; başka hesaptan ödüyorsanız İşlemler'de Düzenle ile değiştirin.`);
        }
      }
      return onSave(o); });
}
function editTx(id){ const t = db.tx.find(x => x.id === id); txForm(t, o => { delete t.done; Object.assign(t, o); }); }
/* accId verilirse (ya da İşlemler'de bir hesap/kart seçiliyse) giriş o hesap/kart için açılır */
function addTx(accId){ const pre = typeof accId === "string" ? accId : (db.accounts.some(a => a.id === S.acc) && S.tab === "islem" ? S.acc : "");
  txForm({type:"gider", date:todayISO(), amount:0, account:pre || (db.accounts[0] || {}).id, to:(db.accounts[1] || db.accounts[0] || {}).id, cat:"", note:""}, o => { db.tx.push({id:uid(), ...o}); }); }
function payCard(id, amt){ const card = db.accounts.find(a => a.id === id), bank = db.accounts.find(a => a.id === card.payAcc) || db.accounts.find(a => a.type !== "kart");
  if (!bank) return alert("Ödeme için önce bir banka hesabı ekleyin.");
  txForm({type:"transfer", date:todayISO(), amount:amt || 0, account:bank.id, to:id, note:"Kart ödemesi"}, o => db.tx.push({id:uid(), ...o})); }
function editLoan(id){ if (needAcc()) return;
  const l = id ? db.loans.find(x => x.id === id) : {name:"", account:db.accounts[0].id, amount:0, count:12, start:thisYM(), day:15};
  form(id ? "Krediyi düzenle" : "Yeni kredi", [
    {k:"name", l:"Kredi adı", t:"text", req:1}, {k:"account", l:"Ödeme yapılan hesap", t:"select", opts:accOpts()},
    {k:"amount", l:"Aylık taksit (₺)", t:"calc", req:1}, {k:"count", l:"Toplam taksit sayısı", t:"number", req:1},
    {k:"start", l:"İlk taksit ayı", t:"month", req:1}, {k:"day", l:"Ödeme günü", t:"number"}], l,
    o => { o.count = Math.max(1, Math.round(o.count)); o.day = o.day || 1; if (id) Object.assign(l, o); else db.loans.push({id:uid(), ...o}); }); }
function editTaksit(id){ if (!db.accounts.some(a => a.type === "kart")){ alert("Önce bir kredi kartı ekleyin."); S.tab = "hesap"; render(); return; }
  const cards = db.accounts.filter(a => a.type === "kart");
  const x = id ? db.taksit.find(y => y.id === id) : {name:"", card:cards[0].id, total:0, count:6, start:thisYM(), day:1};
  form(id ? "Taksiti düzenle" : "Yeni kart taksiti", [
    {k:"name", l:"Alışveriş", t:"text", req:1}, {k:"card", l:"Kart", t:"select", opts:accOpts(a => a.type === "kart")},
    {k:"total", l:"Toplam tutar (₺)", t:"calc", req:1}, {k:"count", l:"Taksit sayısı", t:"number", req:1},
    {k:"start", l:"İlk taksit ayı", t:"month", req:1}, {k:"day", l:"Karta yansıma günü", t:"number"}], x,
    o => { o.count = Math.max(1, Math.round(o.count)); o.day = o.day || 1; if (id) Object.assign(x, o); else db.taksit.push({id:uid(), ...o}); }); }
function editRec(id){ if (needAcc()) return;
  const r = id ? db.rec.find(x => x.id === id) : {name:"", type:"gider", amount:0, day:1, account:db.accounts[0].id, cat:"", start:thisYM(), end:""};
  form(id ? "Düzenliyi düzenle" : "Yeni düzenli kalem", [
    {k:"name", l:"Ad (maaş, kira…)", t:"text", req:1}, {k:"type", l:"Tür", t:"select", opts:[["gider","Gider"],["gelir","Gelir"]]},
    {k:"amount", l:"Aylık tutar (₺)", t:"calc", req:1}, {k:"day", l:"Ayın kaçıncı günü", t:"number"},
    {k:"account", l:"Hesap / kart", t:"select", opts:accOpts()}, {k:"cat", l:"Kategori", t:"text", list:"cats"},
    {k:"start", l:"Başlangıç ayı", t:"month", req:1}, {k:"end", l:"Bitiş ayı (boşsa süresiz)", t:"month"}], r,
    o => { o.day = o.day || 1; if (id) Object.assign(r, o); else db.rec.push({id:uid(), ...o}); }); }
function delItem(coll, id){
  if (coll === "accounts" && (db.tx.some(t => t.account === id || t.to === id) || db.loans.some(l => l.account === id) || db.taksit.some(t => t.card === id) || db.rec.some(r => r.account === id)))
    return alert("Bu hesaba bağlı işlem, kredi, taksit veya düzenli kalem var. Önce onları silin.");
  if (!confirm("Silinsin mi?")) return;
  db[coll] = db[coll].filter(x => x.id !== id); save(); render();
}
function saveSettings(){
  const base = $("#s_base").value; if (!base) return alert("Başlangıç tarihi gerekli.");
  db.settings = {base, goalMonthly: calcEval($("#s_gm").value) || 0, goalTotal: calcEval($("#s_gt").value) || 0, minRate: Math.min(100, Math.max(1, parseFloat($("#s_mr").value) || 40))};
  save(); render();
}
function exportData(){
  const a = document.createElement("a"), url = URL.createObjectURL(new Blob([JSON.stringify(db, null, 1)], {type:"application/json"}));
  a.href = url; a.download = "defterim-yedek-" + todayISO() + ".json"; a.style.display = "none";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
  alert("Yedek indirildi: tarayıcının İndirilenler klasörüne bakın (defterim-yedek-" + todayISO() + ".json).");
}
function showBackupText(){
  const d = $("#dlg"), txt = JSON.stringify(db);
  d.innerHTML = `<h3>Yedek (metin)</h3><p class="muted" style="margin-top:0;font-size:13px">Bu metni kopyalayıp bir not dosyasına yapıştırın. Geri yüklemek için dosyayı .json olarak kaydedip "Yedeği yükle"yi kullanın.</p>
    <textarea id="bk" readonly rows="8" style="width:100%;font:12px monospace;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px">${esc(txt)}</textarea>
    <div class="row"><button class="ghost" id="bkx">Kapat</button><button class="primary" id="bkc">Panoya kopyala</button></div>`;
  $("#bkx").onclick = () => d.close();
  $("#bkc").onclick = async () => { const t = $("#bk"); t.select(); try { await navigator.clipboard.writeText(txt); } catch(e){ document.execCommand("copy"); } $("#bkc").textContent = "Kopyalandı ✓"; };
  d.showModal();
}
function importData(f){ if (!f) return; const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (!o.accounts || !o.tx) throw new Error("Geçersiz yedek dosyası"); if (!confirm("Mevcut veri yedekle değiştirilecek. Devam?")) return; db = Object.assign(blank(), o); save(); render(); } catch(e){ alert("Yüklenemedi: " + e.message); } }; r.readAsText(f); }
function resetAll(){ if (confirm("Tüm veriler kalıcı olarak silinecek. Emin misiniz?")){ db = blank(); save(); render(); } }
function loadDemo(){
  if (db.accounts.length && !confirm("Mevcut veri örnek veriyle değiştirilecek. Devam?")) return;
  const m0 = thisYM(), z = uid(), n = uid(), k1 = uid(), k2 = uid();
  db = {settings:{base:m0 + "-01", goalMonthly:8000, goalTotal:100000},
    accounts:[{id:z, name:"Vadesiz Hesap", type:"banka", opening:25000}, {id:n, name:"Nakit", type:"nakit", opening:1500},
      {id:k1, name:"Kart A", type:"kart", opening:-18000, limit:60000, cut:12, due:22, payAcc:z, payMode:"tam"}, {id:k2, name:"Kart B", type:"kart", opening:-7500, limit:40000, cut:25, due:5, payAcc:z, payMode:"asgari"}],
    loans:[{id:uid(), name:"İhtiyaç kredisi", account:z, amount:6200, count:36, start:addM(m0, -3), day:15}],
    taksit:[{id:uid(), name:"Telefon", card:k1, total:36000, count:12, start:addM(m0, -2), day:1}, {id:uid(), name:"Beyaz eşya", card:k1, total:24000, count:6, start:addM(m0, -1), day:1}, {id:uid(), name:"Tatil", card:k2, total:15000, count:5, start:m0, day:1}],
    rec:[{id:uid(), name:"Maaş", type:"gelir", amount:52000, day:1, account:z, cat:"Maaş", start:addM(m0, -2), end:""}, {id:uid(), name:"Kira", type:"gider", amount:18000, day:3, account:z, cat:"Kira", start:addM(m0, -2), end:""}, {id:uid(), name:"Faturalar", type:"gider", amount:3500, day:10, account:z, cat:"Fatura", start:addM(m0, -2), end:""}],
    tx:[{id:uid(), type:"gider", date:m0 + "-04", amount:2400, account:k1, cat:"Market", note:"Haftalık market"}, {id:uid(), type:"gider", date:m0 + "-08", amount:1100, account:n, cat:"Ulaşım", note:"Yakıt"}, {id:uid(), type:"gider", date:m0 + "-12", amount:1800, account:k2, cat:"Yemek", note:"Dışarıda yemek"}, {id:uid(), type:"gelir", date:m0 + "-06", amount:4000, account:z, cat:"Ek gelir", note:"Serbest iş"}]};
  save(); S.tab = "ozet"; render();
}

/* ---------- çizim ---------- */
const TABS = [["ozet","Özet"],["islem","İşlemler"],["hesap","Hesaplar"],["kredi","Krediler ve taksitler"],["plan","Birikim planı"],["ayar","Ayarlar"]];
function render(){
  $("#tabs").innerHTML = TABS.map(([k, t]) => `<button class="${S.tab === k ? "on" : ""}" onclick="S.tab='${k}';render()">${t}</button>`).join("");
  $("#selm").value = S.m;
  $("#selm").style.visibility = ["ozet","islem","hesap"].includes(S.tab) ? "visible" : "hidden";
  const E = events();
  const html = {ozet:viewOzet, islem:viewIslem, hesap:viewHesap, kredi:viewKredi, plan:viewPlan, ayar:viewAyar}[S.tab](E);
  $("#view").innerHTML = html;
  Drive.paint();
}
$("#selm").onchange = e => { if (e.target.value){ S.m = e.target.value; render(); } };
$("#fab").onclick = () => addTx();
$("#cloud").onclick = () => { if (!Drive.clientId()){ S.tab = "ayar"; render(); } else Drive.sync(true); };
$("#theme").onclick = () => { const r = document.documentElement, dark = getComputedStyle(r).getPropertyValue("--paper").trim() === "#14181e"; r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("defterim_theme", r.dataset.theme); } catch(e){} };
try { const t = localStorage.getItem("defterim_theme"); if (t) document.documentElement.dataset.theme = t; } catch(e){}
load(); render(); Drive.init();
</script>
